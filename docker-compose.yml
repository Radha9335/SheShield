services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    ports: ["127.0.0.1:27017:27017"]
  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/sheshield
      NODE_ENV: production
    depends_on: [mongo]
    ports: ["5000:5000"]
volumes:
  mongo-data:
